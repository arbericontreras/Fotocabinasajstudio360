<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formato de reserva</title>
<link rel="icon" type="image/x-icon" href="img/logo aj studio copia.png">
<style>
:root{--ink:#0a0f1d;--acc:#0070f3;--mute:#475569;--bg:#f1f5f9;--line:#e2e8f0;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.app{display:grid;grid-template-columns:400px 1fr;gap:20px;max-width:1280px;margin:0 auto;padding:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.panel h3{margin:18px 0 8px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.panel h3:first-child{margin-top:0}
label.f{display:block;font-size:.85rem;font-weight:600;margin:10px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical;font-size:.85rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#pks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:block;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;line-height:1.25}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip b{display:block;font-size:.9rem}
.chip small{color:var(--mute);font-size:.76rem}
.chip:has(input:checked){border-color:var(--acc);background:#eff6ff;box-shadow:0 0 0 1px var(--acc)}
.chip:has(input:focus-visible){outline:3px solid var(--acc);outline-offset:2px}
.saldo{margin-top:8px;padding:8px 10px;background:#f8fafc;border-radius:6px;font-size:.88rem}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:var(--ink);color:#fff}
button.p{background:var(--acc)}
button.s{background:#fff;color:var(--ink);border:1px solid #cbd5e1}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.doc{background:#fff;border:1px solid var(--line);box-shadow:0 4px 20px rgba(0,0,0,.06);padding:36px 44px;max-width:820px;font-size:14px;line-height:1.5}
.dh{display:flex;gap:18px;align-items:center;border-bottom:3px solid var(--acc);padding-bottom:14px;margin-bottom:16px}
.logo{min-width:90px;max-width:170px;min-height:64px;display:flex;align-items:center;justify-content:center}
.logo img{max-width:170px;max-height:80px;display:block}
.ph{border:2px dashed #cbd5e1;color:#94a3b8;padding:18px 14px;border-radius:8px;font-size:12px;text-align:center}
.doc h1{font-size:16px;margin:0 0 2px;letter-spacing:.02em}
.emp{font-weight:700;color:var(--acc)}
.doc h2{font-size:12.5px;letter-spacing:.05em;color:var(--acc);margin:16px 0 4px;border-bottom:1px solid var(--line);padding-bottom:2px}
.doc p{margin:2px 0}
.doc ul{margin:4px 0;padding-left:20px}.doc li{margin:3px 0}
.miss{background:#fef3c7;border-radius:3px}
.foot{margin-top:22px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);text-align:center}
.nit{font-size:12px;color:var(--mute)}
.pg{width:100%;border-collapse:collapse}.pg td{padding:0;vertical-align:top}
@media(max-width:900px){.app{grid-template-columns:1fr}.panel{position:static;max-height:none}.doc{padding:22px 18px}}
@page{size:letter;margin:14mm}
@media print{.logo:has(.ph){display:none}body{background:#fff}.panel,.bar,.noprint{display:none!important}.app{display:block;padding:0}.doc{box-shadow:none;border:0;padding:0;max-width:none}.miss{background:none}}
</style>
</head>
<body>
<div class="app">
<form class="panel" onsubmit="return false" autocomplete="off">
  <h3>1. Paquete contratado</h3>
  <div id="pks" role="radiogroup" aria-label="Paquete"></div>

  <h3>2. Cliente</h3>
  <label class="f" for="nom">Nombre del contratante</label><input id="nom">
  <label class="f" for="ced">Cédula del contratante</label><input id="ced" inputmode="numeric" placeholder="1.234.567.890">
  <label class="f" for="cel">Celular(es)</label><input id="cel" inputmode="tel" placeholder="312 000 0000">

  <h3>3. Evento</h3>
  <div class="two">
    <div><label class="f" for="fev">Fecha del evento</label><input id="fev" type="date"></div>
    <div><label class="f" for="fre">Fecha de reserva</label><input id="fre" type="date"></div>
    <div><label class="f" for="hin">Hora de inicio</label><input id="hin" type="time"></div>
    <div><label class="f" for="dur">Duración</label><select id="dur"><option value="1">1 hora</option><option value="2" selected>2 horas</option><option value="3">3 horas</option><option value="4">4 horas</option></select></div>
  </div>
  <label class="f" for="lug">Lugar del evento</label><input id="lug" placeholder="Sitio y dirección">

  <h3>4. Pago</h3>
  <div class="two">
    <div><label class="f" for="tot">Valor total ($)</label><input id="tot" type="number" min="0" step="1000"></div>
    <div><label class="f" for="abo">Abono ($)</label><input id="abo" type="number" min="0" step="1000"></div>
  </div>
  <label class="f" for="med">Medio del abono</label>
  <select id="med"><option>Bre-b</option><option>Nequi</option><option>Daviplata</option><option>Transferencia</option><option>Efectivo</option></select>
  <div class="saldo" id="saldo">Saldo: —</div>
  <div class="two">
    <div><label class="f" for="rnom">Responsable del pago</label><input id="rnom" placeholder="Si es otra persona"></div>
    <div><label class="f" for="rcel">Su celular</label><input id="rcel" inputmode="tel"></div>
  </div>

  <h3>5. Condiciones</h3>
  <p style="margin:0 0 6px;font-size:.8rem;color:var(--mute)">Se rellenan según el paquete y puedes editarlas (una por línea).</p>
  <textarea id="terms" rows="13"></textarea>
  <button type="button" class="s" id="rst" style="margin-top:6px;padding:6px 10px;font-size:.82rem">Restablecer según paquete</button>

  <h3>6. Asesor</h3>
  <label class="f" for="ase">Asesor que atiende</label>
  <select id="ase"></select>

  <details>
    <summary>Asesores, empresa y logo</summary>
    <label class="f" for="lst">Lista de asesores (uno por línea: Nombre, Cargo)</label>
    <textarea id="lst" rows="4">Angela Fonseca, Asesor Comercial
Jose Arberi Contreras, Asesor Comercial</textarea>
    <label class="f" for="emp">Empresa</label><input id="emp" value="AJGeekStudio">
    <label class="f" for="nit">NIT (va en el encabezado)</label><input id="nit" placeholder="000.000.000-0">
    <label class="f" for="dir">Dirección (pie de página)</label><input id="dir" value="Kra 72m Bis B # 43-63 Sur, Bogotá">
    <label class="f" for="tel">Teléfono fijo (pie de página)</label><input id="tel" value="(601) 548 5934">
    <label class="f" for="web">Página de descarga</label><input id="web" value="https://fotocabinasajstudio360.vercel.app/">
    <label class="f" for="lg">Logo (se guarda en este navegador)</label>
    <input id="lg" type="file" accept="image/*">
    <button type="button" class="s" id="nolg" style="margin-top:6px;padding:6px 10px;font-size:.82rem">Quitar logo</button>
  </details>
</form>

<main>
  <div class="bar">
    <button class="p" id="pdf">Descargar PDF</button>
    <button id="wa">Enviar por WhatsApp</button>
    <button class="s" id="cp">Copiar texto</button>
    <button class="s" id="pr">Imprimir</button>
    <button class="s" id="nw">Nueva reserva</button>
  </div>
  <article class="doc" id="doc"></article>
</main>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PK={
 tira:{n:'Impresión en tira',d:'Fotocabina con recuerdos físicos impresos al momento.',b:['tira','foto','all']},
 dig:{n:'Digital Pro',d:'Cabina digital con efectos (Proms y tira de fotos digital), enviado al instante.',b:['dig','all']},
 c360:{n:'Cabina 360',d:'Grabación de tu video con efectos de audio y video.',b:['v360','all']},
 comp:{n:'Completo',d:'Cabina 360 y fotocabina impresión tira: la experiencia completa.',b:['v360','tira','foto','all']},
 full:{n:'Full Premium',d:'Cabina 360 + fotocabina digital y fotocabina impresión tira: la experiencia más completa.',b:['v360','dig','tira','foto','all']}
};
const B={
 tira:['El cliente deberá enviar el logo que desea incluir en la tira fotográfica en formato JPG y tamaño carta horizontal antes del evento. En caso de no recibirlo oportunamente, se entenderá que el servicio no requiere la inclusión de logo.','Se entregará una tira fotográfica impresa por cada sesión realizada.','Cada sesión consta de 3 fotografías, impresas en una tira de aproximadamente 5 cm x 15 cm, incluyendo las imágenes y el logo suministrado por el cliente.'],
 dig:['Las fotografías con efectos (Proms y tira de fotos digital) se envían al instante en formato digital, para lo cual se requiere conexión a internet en el lugar del evento.'],
 foto:['Las fotografías almacenadas serán retiradas del equipo y publicadas posteriormente en la página oficial del evento {emp} para su descarga, dentro de los siguientes 2 a 3 días hábiles: {web}','Los accesorios para las fotografías, tales como gafas, pelucas y demás elementos de animación, están incluidos dentro del servicio sin costo adicional, pero son de uso exclusivo durante el servicio y no podrán ser retirados ni conservados por los clientes.'],
 v360:['El servicio de Cabina 360 incluye la grabación de videos con efectos de audio y video durante el horario contratado.','Los videos serán publicados inmediatamente en la página oficial del evento {emp} para su descarga (Depende de la señal de internet) {web}','La plataforma 360 requiere un espacio plano area de 3x3 metros y despejado para su instalación.'],
 all:['El cliente debe garantizar el acceso al lugar con anticipación para la instalación del equipo y una toma de corriente cercana.','Cualquier cambio de fecha, horario o lugar debe acordarse con anticipación con el asesor comercial, En caso de presentarse fenómenos naturales, condiciones climáticas adversas, riñas, actos de violencia, alteraciones del orden público o cualquier situación que represente un riesgo para la integridad física de, sus colaboradores o sus equipos de trabajo, este podrá suspender o cancelar la prestación del servicio de manera inmediata, sin que ello genere penalidades, indemnizaciones o reclamaciones en su contra.']
};
let pk='tira',logo='',TXT='',FOOT='',dirtyT=false;

/* ---- números a letras (pesos) ---- */
const U=['','un','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiún','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const D=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
function w999(n){if(n==100)return'cien';const c=Math.floor(n/100),r=n%100;let s=C[c];if(r){if(s)s+=' ';s+=r<30?U[r]:D[Math.floor(r/10)]+(r%10?' y '+U[r%10]:'')}return s}
function letras(n){if(!n)return'cero pesos';const m=Math.floor(n/1e6),k=Math.floor(n%1e6/1e3),u=n%1e3,s=[];
 if(m)s.push(m==1?'un millón':w999(m)+' millones');if(k)s.push(k==1?'mil':w999(k)+' mil');if(u)s.push(w999(u));
 return s.join(' ')+(n%1e6===0?' de pesos':' pesos')}
const money=n=>'$'+n.toLocaleString('es-CO');
const t12=m=>{m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;return(h%12||12)+':'+String(mm).padStart(2,'0')+(h>=12?' pm':' am')};
const fd=v=>v?v.split('-').reverse().join('/'):'';

/* ---- datos del documento ---- */
const g=id=>$(id).value.trim();
function data(){
 const P=PK[pk],tot=+g('tot')||0,abo=+g('abo')||0,sal=Math.max(tot-abo,0),d=+g('dur')||0,din=n=>money(n)+' ('+letras(n)+')';
 let hor='';if(g('hin')){const[h,m]=g('hin').split(':').map(Number);hor=t12(h*60+m)+(d?' a '+t12(h*60+m+d*60):'')}
 const dur=d?(d==1?'1 hora':String(d).replace('.',',')+' horas'):'';
 $('saldo').textContent='Saldo pendiente: '+(tot?money(sal):'—');
 return[
  ['DATOS DEL CONTRATANTE',[['Nombre',g('nom')],['Cédula',g('ced')],['Celular',g('cel')]]],
  ['INFORMACIÓN DE LA RESERVA',[['Fecha de reserva',fd(g('fre'))],['Fecha del evento',fd(g('fev'))]]],
  ['SERVICIO CONTRATADO',[['Paquete',P.n],['Incluye',P.d]]],
  ['HORARIO DEL SERVICIO',[['Duración',dur],['Horario',hor]]],
  ['VALOR DEL SERVICIO',[['Valor total',tot?money(tot):''],
    ['Abono recibido',g('abo')===''?'':abo?din(abo)+' mediante '+g('med')+'.':'$0'],
    ['Saldo pendiente',tot?(sal?din(sal)+', el cual deberá ser cancelado el día del evento antes de iniciar el servicio.':'$0 (servicio pagado en su totalidad).'):'']]],
  ['RESPONSABLE DEL PAGO DEL SALDO Y RECEPCIÓN DEL SERVICIO',[['Nombre',g('rnom')||g('nom')],['Celular',g('rcel')||g('cel')]]],
  ['LUGAR DEL EVENTO',[['Dirección',g('lug')]]]
 ]}
function terms(){return $('terms').value.split('\n').map(x=>x.replace(/^[*•\-\s]+/,'').trim()).filter(Boolean)}
function saludo(){const h=new Date().getHours();return h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches'}

function render(){
 const s=data(),A=adv(),emp=g('emp')||'AJGeekStudio',nit=g('nit'),T=terms(),miss='<span class="miss">__________</span>';
 FOOT='Dirección: '+g('dir')+'  |  Fijo: '+g('tel');
 const intro='Adjuntamos el presente documento como constancia de reserva y acuerdo para la prestación del servicio de '+emp+'.';
 const cierre='Agradecemos su confianza y esperamos contribuir al éxito de su evento.';
 $('doc').innerHTML=
  `<table class="pg"><tbody><tr><td><div class="dh"><div class="logo">${logo?`<img src="${logo}" alt="Logo">`:'<span class="ph noprint">Tu logo aquí</span>'}</div><div><h1>CONFIRMACIÓN DE RESERVA Y ACUERDO DE SERVICIO</h1><div class="emp">${esc(emp.toUpperCase())}</div><div class="nit">NIT: ${nit?esc(nit):miss}</div></div></div>`+
  `<p>${saludo()},</p><p>${esc(intro)}</p>`+
  s.map(([t,r])=>`<h2>${t}</h2>`+r.map(([l,v])=>`<p><b>${l}:</b> ${v?esc(v):miss}</p>`).join('')).join('')+
  `<h2>CONDICIONES Y OBSERVACIONES</h2><ul>${T.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`+
  `<p style="margin-top:14px">${cierre}</p><p style="margin-top:10px">Cordialmente,<br><b>${esc(A.n)}</b><br>${esc(A.c)}</p></td></tr></tbody>`+
  `<tfoot><tr><td><div class="foot">${esc(FOOT)}</div></td></tr></tfoot></table>`;
 TXT=['ASUNTO: CONFIRMACIÓN DE RESERVA Y ACUERDO DE SERVICIO '+emp.toUpperCase(),saludo()+',',intro,'']
  .concat(s.flatMap(([t,r])=>[t].concat(r.map(([l,v])=>l+': '+(v||'________')),'')))
  .concat(['CONDICIONES Y OBSERVACIONES'],T.map(x=>'* '+x),['',cierre,'Cordialmente,',A.n,A.c,'',emp+(nit?' - NIT '+nit:''),FOOT]).join('\n');
}

/* ---- paquete y condiciones ---- */
function fillTerms(){$('terms').value=PK[pk].b.flatMap(k=>B[k]).join('\n').replace(/\{emp\}/g,g('emp')).replace(/\{web\}/g,g('web'));dirtyT=false}
$('pks').innerHTML=Object.keys(PK).map(k=>`<label class="chip"><input type="radio" name="pk" value="${k}"${k==pk?' checked':''}><b>${PK[k].n}</b><small>${PK[k].d.split(/[,:(]/)[0]}</small></label>`).join('');
$('pks').addEventListener('change',e=>{
 if(dirtyT&&!confirm('Cambiar de paquete reemplaza las condiciones que editaste. ¿Continuar?')){document.querySelector('input[name=pk][value='+pk+']').checked=true;return}
 pk=e.target.value;fillTerms();render()});
$('rst').onclick=()=>{fillTerms();render()};

/* ---- memoria del asesor/empresa/logo ---- */
const KEYS=['lst','emp','nit','dir','tel','web'];
function advisors(){return $('lst').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf(',');return i<0?{n:l,c:'Asesor Comercial'}:{n:l.slice(0,i).trim(),c:l.slice(i+1).trim()||'Asesor Comercial'}})}
function adv(){const a=advisors();return a.find(x=>x.n==$('ase').value)||a[0]||{n:'',c:''}}
function fillAse(sel){$('ase').innerHTML=advisors().map(x=>`<option value="${esc(x.n)}">${esc(x.n)}</option>`).join('');if(sel)$('ase').value=sel;if(!$('ase').value&&$('ase').options.length)$('ase').selectedIndex=0}
function save(){try{const o={logo,ase:$('ase').value};KEYS.forEach(k=>o[k]=$(k).value);localStorage.setItem('rsvAJG',JSON.stringify(o))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem('rsvAJG')||'{}');KEYS.forEach(k=>{if(o[k]!=null)$(k).value=o[k]});logo=o.logo||'';fillAse(o.ase)}catch(e){fillAse()}}
$('lg').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();
 im.onload=()=>{const s=Math.min(1,500/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);logo=c.toDataURL('image/png');URL.revokeObjectURL(im.src);save();render()};
 im.src=URL.createObjectURL(f)};
$('nolg').onclick=()=>{logo='';$('lg').value='';save();render()};

/* ---- acciones ---- */
document.querySelector('form').addEventListener('input',e=>{const i=e.target.id;if(i=='lst')fillAse($('ase').value);if(i=='terms')dirtyT=true;if(KEYS.includes(i)||i=='ase')save();render()});
$('pr').onclick=()=>{const t=document.title;document.title='Reserva - '+(g('nom')||'cliente');window.print();document.title=t};
/* ---- PDF propio: tamaño carta (612x792 pt), texto vectorial, sin librerías ---- */
const PW=612,PH=792,ML=42,MR=42,MT=44,MB=64,CW=PW-ML-MR,ACC='0 0.44 0.95',MUT='0.28 0.33 0.41',INK='0.04 0.06 0.11';
const mc=document.createElement('canvas').getContext('2d');
const mw=(t,b,sz)=>{mc.font=(b?'bold ':'')+sz+'px Helvetica,Arial,"Liberation Sans",sans-serif';return mc.measureText(t).width};
const pt=t=>String(t).replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/•/g,'\x95').replace(/[^\x00-\xFF]/g,'?');
const pe=t=>t.replace(/[\\()]/g,'\\$&');
function logoJpeg(){return new Promise(res=>{if(!logo)return res(null);const im=new Image();
 im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);
  res({w:c.width,h:c.height,d:Uint8Array.from(atob(c.toDataURL('image/jpeg',.92).split(',')[1]),ch=>ch.charCodeAt(0))})};
 im.onerror=()=>res(null);im.src=logo})}
function buildPDF(lg){
 render();
 const S=data(),A=adv(),emp=g('emp')||'AJGeekStudio',nit=g('nit'),T=terms(),M='__________',pages=[];let cur='',y=MT;
 const need=h=>{if(y+h>PH-MB){pages.push(cur);cur='';y=MT}};
 const txt=(x,yy,str,b,sz,col)=>`BT ${col} rg /F${b?2:1} ${sz} Tf ${x.toFixed(2)} ${(PH-yy).toFixed(2)} Td (${pe(pt(str))}) Tj ET\n`;
 function flow(runs,x,w,sz,lead){
  const tk=[];
  runs.forEach(r=>String(r.t).split(/(\s+)/).forEach(q=>{if(q==='')return;const sp=/^\s+$/.test(q),t=pt(q);
   if(!sp&&mw(t,r.b,sz)>w){let c='';for(const ch of t){if(mw(c+ch,r.b,sz)>w){tk.push({t:c,b:r.b,col:r.col});c=''}c+=ch}tk.push({t:c,b:r.b,col:r.col})}
   else tk.push({t,b:r.b,col:r.col,sp})}));
  const L=[];let ln=[],lw=0;
  const fl=()=>{while(ln.length&&ln[ln.length-1].sp)ln.pop();if(ln.length)L.push(ln);ln=[];lw=0};
  for(const k of tk){const wk=mw(k.t,k.b,sz);if(k.sp){if(ln.length){ln.push(k);lw+=wk}continue}if(lw+wk>w&&ln.length)fl();ln.push(k);lw+=wk}
  fl();
  for(const l of L){need(lead);let xx=x,i=0;
   while(i<l.length){let j=i,str='';while(j<l.length&&l[j].b==l[i].b&&l[j].col==l[i].col){str+=l[j].t;j++}
    cur+=txt(xx,y+sz,str,l[i].b,sz,l[i].col||INK);xx+=mw(str,l[i].b,sz);i=j}
   y+=lead}}
