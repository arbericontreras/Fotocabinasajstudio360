<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asistente AJ Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaff;--soft:#eeeafb;--ink:#1b1740;--muted:#5d5a7a;--pink:#e6397a;--line:#dcd7f2;--head:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--soft);color:var(--ink);font-size:16px;display:flex;justify-content:center}
.bot{width:100%;max-width:480px;height:100%;background:#fff;display:flex;flex-direction:column;overflow:hidden;border-left:1px solid var(--line);border-right:1px solid var(--line)}
body.embed{background:#fff}
body.embed .bot{max-width:none;border:0}
header{background:var(--ink);color:#fff;padding:14px 18px;font:800 1.05rem var(--head);display:flex;justify-content:space-between;align-items:center}
header span{display:flex;align-items:center;gap:8px}
header small{display:block;font:500 .72rem var(--body);opacity:.85}
header.online{background:#0f7a43}
.opts button.en{border-color:#16a34a;background:#ecfdf5;color:#065f46;font-weight:600}
header button{background:none;border:0;color:#fff;font-size:1.3rem;cursor:pointer}
header a{color:#fff;font:500 .85rem var(--body);text-decoration:none;opacity:.85}
body.embed header a{display:none}
body:not(.embed) #botX{display:none}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover}
.log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.m{max-width:85%;padding:10px 14px;border-radius:16px;font-size:.95rem;white-space:pre-line}
.m.b{background:#fff;border:1px solid var(--line);align-self:flex-start}
.m.u{background:var(--pink);color:#fff;align-self:flex-end}
.m a{color:var(--pink);font-weight:600}
.m img{display:block;width:100%;max-width:220px;border-radius:10px;margin-top:8px;background:#fff}
.opts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--line);max-height:150px;overflow:auto}
.opts button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:500 .85rem var(--body);cursor:pointer;color:var(--ink)}
.opts button:hover{border-color:var(--pink)}
.say{display:flex;gap:8px;padding:0 12px 12px}
.say input{flex:1;min-width:0;border:2px solid var(--line);border-radius:999px;padding:9px 14px;font:.95rem var(--body)}
.say button{border:0;background:var(--pink);color:#fff;border-radius:999px;padding:0 16px;font:600 .9rem var(--body);cursor:pointer}
</style></head>
<body>
<div class="bot" id="bot">
  <header id="hdr">
    <span><img class="av" src="img/deep.png" alt="" onerror="this.remove()"><div>Asistente AJ Studio<small id="estado" role="status">Asistente automático</small></div></span>
    <button id="botX" aria-label="Cerrar">×</button><a href="index.html">← Inicio</a>
  </header>
  <div class="log" id="log"></div>
  <div class="opts" id="opts"></div>
  <form class="say" id="say"><input id="sayIn" placeholder="Escribe tu respuesta o pregunta" aria-label="Tu respuesta o pregunta" autocomplete="off"><button>Enviar</button></form>
</div>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const EMB = window.parent !== window;               /* true cuando está dentro de index.html */
if(EMB) document.body.classList.add("embed");
const irA = u => { (EMB ? window.top : window).location.href = u; };

const INV   = ["Hasta 50","De 50 a 100","De 100 a 200","Más de 200"];
const HORAS = [1,2,3,4];
const OBJ   = ["Videos 360 para redes","Fotos impresas","Fotos digitales (proms)","360 + fotos impresas","Las 3 máquinas"];
const PLAN_POR_OBJ = ["basico","tira","pro","completo","premium"];   /* mismo orden que OBJ */
const TIPS = {
 "Boda":"Consejo: activa la cabina después o antes del vals, cuando la pista ya está animada, y déjala disponible hasta el final.",
 "Quince años":"Consejo: úsala después o antes del vals y la hora loca, y pide a la quinceañera y su corte que inviten al resto.",
 "Cumpleaños":"Consejo: ábrela desde que llegan los invitados para que todos tengan su video antes del pastel.",
 "Fiesta prom":"Consejo: abre la cabina desde la llegada de los invitados y déjala hasta el final: los videos 360 y las fotos son lo que más comparten en redes.",
 "Evento empresarial":"Consejo: puedes pedir marco o tira con el logo de tu empresa; funciona muy bien en cierres de año y lanzamientos.",
 "Fiesta infantil":"Consejo: ubícala cerca de la zona de juegos y cuida que haya un adulto acompañando a los niños en la plataforma.",
 "Baby shower":"Consejo: un marco o tira con el nombre del bebé y la fecha se convierte en un recuerdo para los papás.",
 "Grado":"Consejo: un marco con el año y el nombre de la promoción convierte los videos y fotos en recuerdo de grado.",
 "Otro":"Consejo: cuéntale a tu asesor el ambiente del evento para elegir la mejor ubicación de la cabina."};
const AREA = {basico:"2 x 2 m",pro:"2 x 2 m",tira:"2 x 2 m",completo:"3 x 3 m",premium:"4 x 4 m"};
const espacio = id => `Para dar un buen servicio te recomiendo:\n• Un lugar luminoso, sin luces de colores fuertes.\n• Un área libre de unos ${AREA[id||"pro"]}, sin mesas ni columnas alrededor.\n• Un tomacorriente a menos de 3 m de la cabina.\n• Piso firme y plano, lejos del paso de meseros o del baño.`;
const hTxt = h => h+(h===1?" hora":" horas");
const AVISO_CRUCE = "Esa fecha ya tiene otro evento reservado, pero igual envío tu cotización: el asesor confirma si hay disponibilidad.";

let enLinea = false;   /* ¿hay un asesor conectado? */
let fotosT;   /* temporizador de «llévame a descargas» */
let ctx = {};
let nombre = "";   /* se conserva aunque el flujo se reinicie */
let tel = "";      /* celular del cliente */

function say(t,c,waNum,qr){ const d=document.createElement("div"); d.className="m "+c; d.textContent=t;
  if(waNum){ d.appendChild(document.createElement("br")); const a=document.createElement("a"); a.href="https://wa.me/"+waNum; a.target="_blank"; a.rel="noopener"; a.textContent="Abrir WhatsApp"; d.appendChild(a); }
  /* ► IMAGEN DEL QR DE PAGO: aparece aquí solo cuando el asesor en línea la envía (botón «Enviar QR de reserva» de su panel).
       La ruta de la imagen se cambia en config.js (QR_IMG). */
  if(qr){ const i=new Image(); i.src=QR_IMG; i.alt="QR para apartar la fecha"; i.onerror=()=>i.remove(); d.appendChild(i); }
  $("log").appendChild(d); $("log").scrollTop=1e9; }
function opts(list){ clearTimeout(fotosT); $("opts").innerHTML=""; list.forEach(([l,f,c])=>{ const b=document.createElement("button"); b.type="button"; if(c) b.className=c; b.textContent=l; b.onclick=()=>{ say(l,"u"); setTimeout(f,200); }; $("opts").appendChild(b); }); }
function pide(paso,texto){ ctx.esperando=paso; say(texto,"b"); opts([]); }

function pedirNombre(luego){ ctx.esperando="nombre"; ctx.luego=luego; say("¿Cómo te llamas?","b"); opts([]); }

/* ===== Flujo: nombre → tipo → invitados → horas → objetivo → recomendación ===== */
function inicio(){ ctx={}; if(!nombre) pedirNombre(preguntaTipo); else preguntaTipo(); }
function preguntaTipo(){
  say(`¿Qué tipo de evento vas a celebrar${nombre?", "+nombre:""}?`,"b");
  opts([...TIPOS.map(t=>[t,()=>{ if(t==="Otro"){ pide("otro","¿Qué tipo de evento es? Escríbelo, por ejemplo: aniversario."); } else { ctx.tipo=t; pInv(); } }]),
    ...(live?[]:[[enLinea?"🟢 Hablar con un asesor en línea":"Hablar con un asesor",contactar,enLinea?"en":""]]),...(live?[["Confirmar mi reserva",verQR]]:[]),["Descargar mis fotos",guiaFotos]]);
}
function pInv(){ say("¿Cuántos invitados esperas?","b"); opts(INV.map(v=>[v,()=>{ctx.inv=v;pHoras();}])); }
function pHoras(){ say("¿Cuántas horas de servicio necesitas?","b");
  opts(HORAS.map(h=>[hTxt(h),()=>{ ctx.h=h;
    if(ctx.inv===INV[3]){ ctx.obj=OBJ[4]; recomendar(); } else pObj(); }])); }
function pObj(){ say("¿Qué quieres para tus invitados? Si no estás seguro, te recomiendo yo según tus invitados y horas.","b");
  opts([["Recomiéndame uno",recomendarAuto],...OBJ.map(v=>[v,()=>{ctx.obj=v;recomendar();}])]); }

function planAuto(){
  const g = INV.indexOf(ctx.inv), h = ctx.h; let id, r;
  if(g===3){ id="premium"; r="con más de 200 invitados necesitas la experiencia más completa para que nadie se quede sin participar."; }
  else if(g===2){
    if(h>=3){ id="premium"; r="con 100 a 200 invitados y "+hTxt(h)+" hay tiempo para que todos prueben el video 360, las fotos digitales y la tira impresa."; }
    else { id="completo"; r="con 100 a 200 invitados combina el video 360 con la tira impresa, así hay recuerdo para todos."; } }
  else if(g===1){
    if(h>=4){ id="completo"; r="con 50 a 100 invitados y 4 horas alcanza para el video 360 y la tira impresa sin filas largas."; }
    else { id="tira"; r="con 50 a 100 invitados la tira impresa es el recuerdo que se llevan en la mano."; } }
  else {
    if(ctx.tipo==="Evento empresarial"){ id="tira"; r="para un evento empresarial la tira impresa lleva el logo de tu empresa."; }
    else { id="pro"; r="para un grupo de hasta 50 invitados la opción digital es práctica, muy animada y de buen precio."; } }
  if(h===1 && g>=2) r += "\n\nOjo: con tantos invitados 1 hora puede quedarse corta; te sugiero 2 o 3 horas.";
  return {id,r};
}
function recomendarAuto(){ ctx.auto=true; ctx.obj="Que le recomienden un plan"; recomendar(); }

function recomendar(){
  const auto = ctx.auto ? planAuto() : null;
  const id = ctx.inv===INV[3] ? "premium" : auto ? auto.id : PLAN_POR_OBJ[OBJ.indexOf(ctx.obj)];
  const p = PLANES.find(x=>x.id===id); ctx.plan=id;
  let t = `${nombre?nombre+", p":"P"}ara ${ctx.tipo.toLowerCase()} con ${ctx.inv.toLowerCase()} invitados te recomiendo:\n\n${p.nombre} · ${hTxt(ctx.h)}\nIncluye: ${["2 operadores de logística",...p.incluye].join(", ")}.`;
  if(ctx.inv===INV[3]){
    t += "\n\nPara más de 200 invitados el Full Premium es la mejor opción: es la experiencia más completa y más gente puede participar.";
    if(ctx.h<4) t += " Si quieres, un asesor te ayuda a revisar si conviene más tiempo."; }
  if(auto && ctx.inv!==INV[3]) t += "\n\nLo elegí porque "+auto.r;
  say(t,"b");
  opts([["Ver mi cotización",pLugar],["Ver recomendaciones",recomendaciones],["Ajustar en el cotizador",usarCot],["Empezar de nuevo",inicio]]);
}
/* Recomendaciones para dar un buen servicio: van aparte para no llenar el chat de texto */
function recomendaciones(){
  say(`${TIPS[ctx.tipo]||TIPS["Otro"]}\n\n${espacio(ctx.plan)}`,"b");
  opts([["Ver mi cotización",pLugar],["Ajustar en el cotizador",usarCot],["Empezar de nuevo",inicio]]);
}

/* Pasa la recomendación al cotizador de la página (o abre index.html si el bot está solo) */
function usarCot(){
  if(EMB) parent.postMessage({t:"cotizador",plan:ctx.plan,h:ctx.h,tipo:ctx.tipo},"*");
  else irA("index.html#cotizar"); }

/* --- Descarga de fotos --- */
function guiaFotos(){
  say("Te llevo a descargar tus fotos y videos. Usa el código del evento: es el que aparece en tu tira impresa (o escanea el QR de la cabina).","b");
  const ir=()=>irA("descargar.html");
  opts([["Ir ahora",ir],
    ["Necesito ayuda",()=>{ ctx.msg="Hola, tengo problemas para descargar mis fotos y videos."; contactar(); }],
    ["Volver al inicio",inicio]]);
  if(!live) fotosT=setTimeout(ir,1500);   /* si no toca nada, lo lleva solo (en chat con asesor no, para no perder la charla) */
}

/* --- Datos del lugar para la cotización: localidad → barrio → dirección → fecha → hora → celular --- */
function pLugar(){ ctx.lugar={}; say("Para calcular tu cotización necesito los datos del evento. ¿En qué localidad es?","b");
  opts(LOCALIDADES.map(l=>[l,()=>{ ctx.lugar.loc=l; pide("barrio","¿En qué barrio?"); }])); }
function bloqueado(){ ctx.esperando=null; say(MENSAJE_NO_DISPONIBLE,"b"); opts([["Cambiar fecha o ubicación",pLugar],["Empezar de nuevo",inicio]]); }
/* El valor se muestra al final, cuando el cliente ya dio los datos del evento y el lugar */
function mostrarCotizacion(){
  const p=PLANES.find(x=>x.id===ctx.plan), L=ctx.lugar, precio=precioFinal(p,ctx.h,"Bogotá",L.loc);
  say(`Esta es tu cotización, ${nombre}:\n\n${p.nombre} · ${hTxt(ctx.h)}\nEvento: ${ctx.tipo} · ${L.fecha} · ${L.hora}\nLugar: ${L.dir}, ${L.barrio}, ${L.loc}\n\nValor: ${peso(precio)}\nIncluye: ${["2 operadores de logística",...p.incluye].join(", ")}.\n\nPrecio de referencia; el asesor confirma la disponibilidad de tu fecha.`,"b");
  opts([["Reservar con un asesor",reservarConAsesor],["Ver recomendaciones",recomendaciones],["Ajustar en el cotizador",usarCot],["Empezar de nuevo",inicio]]);
}
/* El celular se pide solo cuando el cliente quiere reservar con un asesor */
function reservarConAsesor(){ if(!tel) pide("tel","Para pasarte con un asesor, ¿a qué número de celular te contactamos?"); else contactar(); }
function reservarCot(){
  if(!tel) return pide("telcot","Para pasarte con un asesor, ¿a qué número de celular te contactamos?");
  ctx.msg=ctx.msg.replace(/\n¿Tienen disponibilidad\?$/,`\nCelular: ${tel}\n¿Tienen disponibilidad?`); contactar(); }

function parseHora(t){
  const m=t.trim().toLowerCase().replace(/\./g,"").match(/^(\d{1,2})(?:[:h](\d{2}))?\s*(am|pm)?$/);
  if(!m) return null;
  let h=+m[1], mi=+(m[2]||0);
  if(m[3]==="pm"&&h<12) h+=12; if(m[3]==="am"&&h===12) h=0;
  if(h>23||mi>59) return null;
  return String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0"); }
const horaOk = h => h && /:(00|30)$/.test(h);
function parseFecha(t){ const m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); if(!m) return null;
  const d=new Date(+m[3],+m[2]-1,+m[1]); if(d.getMonth()!==+m[2]-1||d<new Date(new Date().toDateString())) return null;
  return {iso:`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`, txt:`${m[1]}/${m[2]}/${m[3]}`}; }

function pasoTexto(t){
  const e=ctx.esperando, L=ctx.lugar, R=ctx.res;
  if(e==="nombre"){
    const n=t.replace(/\s+/g," ").trim().slice(0,40);
    if(n.length<2) return say("Escribe tu nombre, por favor.","b");
    nombre=n; ctx.esperando=null; say(`Mucho gusto, ${nombre}.`,"b");
    const f=ctx.luego; ctx.luego=null; if(f) f(); }
  else if(e==="otro"){ const o=t.replace(/\s+/g," ").trim().slice(0,50);
    if(o.length<3) return say("Cuéntame qué tipo de evento es, por favor.","b");
    ctx.tipo=o.charAt(0).toUpperCase()+o.slice(1); ctx.esperando=null; pInv(); }
  /* --- cotización --- */
  else if(e==="barrio"){ if(t.length<3) return say("Escribe el nombre del barrio.","b");
    L.barrio=t; if(sinServicio(L.loc,t)) return bloqueado();
    pide("dir","¿Cuál es la dirección del evento?"); }
  else if(e==="dir"){ if(t.length<5) return say("Escribe la dirección completa, por ejemplo: Calle 10 # 20-30.","b");
    L.dir=t; pide("fecha","¿Qué fecha es el evento? Escríbela como dd/mm/aaaa."); }
  else if(e==="fecha"){ const f=parseFecha(t);
    if(!f) return say("No pude leer esa fecha. Escríbela como dd/mm/aaaa, por ejemplo 15/12/2026, y que sea una fecha futura.","b");
    L.iso=f.iso; L.fecha=f.txt; pide("hora","¿A qué hora empieza el evento? Solo en punto o y media, por ejemplo: 7:00 pm o 7:30 pm."); }
  else if(e==="hora"){ const h=parseHora(t);
    if(!horaOk(h)) return say("Escríbela en punto o y media, por ejemplo 7:00 pm o 7:30 pm.","b");
    L.hora=fmtHora(h); L.h24=h; ctx.esperando=null;
    if(avisoCruce(L.iso,h)) say(AVISO_CRUCE,"b");
    mostrarCotizacion(); }
  else if(e==="telcot"){ const d=parseTel(t);
    if(!d) return say("Escribe un celular de 10 dígitos, por ejemplo 3001234567.","b");
    tel=d; ctx.esperando=null; reservarCot(); }
  else if(e==="tel"){ const d=parseTel(t);
    if(!d) return say("Escribe un celular de 10 dígitos, por ejemplo 3001234567.","b");
    tel=d; ctx.esperando=null; contactar(); }
  /* --- confirmar reserva --- */
  else if(e==="rfecha"){ const f=parseFecha(t);
    if(!f) return say("No pude leer esa fecha. Escríbela como dd/mm/aaaa, por ejemplo 15/12/2026.","b");
    R.iso=f.iso; R.fecha=f.txt; siguienteRes(); }
  else if(e==="rhora"){ const h=parseHora(t);
    if(!horaOk(h)) return say("Escríbela en punto o y media, por ejemplo 7:00 pm o 7:30 pm.","b");
    R.h24=h; siguienteRes(); }
  else if(e==="rtel"){ const d=parseTel(t);
    if(!d) return say("Escribe un celular de 10 dígitos, por ejemplo 3001234567.","b");
    R.tel=d; tel=d; siguienteRes(); }
  else if(e==="rtipoO"){ const o=t.replace(/\s+/g," ").trim().slice(0,50);
    if(o.length<3) return say("Cuéntame qué tipo de evento es, por favor.","b");
    R.tipo=o.charAt(0).toUpperCase()+o.slice(1); siguienteRes(); }
  else if(e==="rbarrio"){ if(t.length<3) return say("Escribe el nombre del barrio.","b");
    R.barrio=t; if(sinServicio(R.loc,t)){ ctx.esperando=null; say(MENSAJE_NO_DISPONIBLE,"b");
      return opts([["Cambiar ubicación",()=>{ R.loc=""; R.barrio=""; siguienteRes(); }],["Volver al inicio",inicio]]); }
    siguienteRes(); }
  else if(e==="rdir"){ if(t.length<5) return say("Escribe la dirección completa, por ejemplo: Calle 10 # 20-30.","b");
    R.dir=t; siguienteRes(); }
  else if(e==="rref"){ if(t.length<3) return say("Escribe el nombre de quien pagó o la referencia del comprobante.","b");
    R.ref=t.slice(0,60); ctx.esperando=null; guardarRes(); }
}

/* --- Contacto: asesor en línea si hay; si no, WhatsApp con asesor al azar --- */
function contactar(){
  if(!nombre) return pedirNombre(contactar);
  let m = "Hola, vengo de la página de AJ Studio y quiero asesoría para mi evento.";
  if(ctx.msg) m = ctx.msg;
  else if(ctx.plan){ const p=PLANES.find(x=>x.id===ctx.plan);
    m = `Hola, quiero esta cotización para mi evento:\nEvento: ${ctx.tipo}\nInvitados: ${ctx.inv}\nBusco: ${ctx.obj}\nPlan: ${p.nombre}, ${hTxt(ctx.h)} (${peso(precioFinal(p,ctx.h,"Bogotá",ctx.lugar?ctx.lugar.loc:""))})\nIncluye 2 operadores de logística.`
      +(ctx.lugar?`\nFecha: ${ctx.lugar.fecha}\nHora: ${ctx.lugar.hora}${tel?`\nCelular: ${tel}`:""}\nCiudad: Bogotá\nLocalidad: ${ctx.lugar.loc}\nBarrio: ${ctx.lugar.barrio}\nDirección: ${ctx.lugar.dir}`:"")
      +(ctx.lugar&&avisoCruce(ctx.lugar.iso,ctx.lugar.h24)?"\n"+avisoCruce(ctx.lugar.iso,ctx.lugar.h24):"")
      +`\n¿Tienen disponibilidad?`; }
  abrirAsesor(m.replace(/^Hola, /, `Hola, soy ${nombre}. `));
}

/* ===== Asesor en línea (chat en vivo) ===== */
let live = false, es = null, chatId = sessionStorage.getItem("ajChat") || "", presT;
const vistos = new Set();
const api = (path,method,body) => fetch(`${DB}/${path}.json`,{method,body:body?JSON.stringify(body):undefined}).then(r=>r.json());

let au;
function beep(){ try{ au = au || new (window.AudioContext||window.webkitAudioContext)(); if(au.state==="suspended") au.resume();
  const t=au.currentTime, o=au.createOscillator(), g=au.createGain(); o.type="sine";
  o.frequency.setValueAtTime(880,t); o.frequency.setValueAtTime(1175,t+.12);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.25,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.3);
  o.connect(g).connect(au.destination); o.start(t); o.stop(t+.3); }catch(e){} }

const enviarAsesor = t => { api(`chats/${chatId}/meta`,"PATCH",{nombre,tel,ultimo:t.slice(0,80),ts:Date.now()});
  return api(`chats/${chatId}/msgs`,"POST",{de:"c",t,ts:Date.now()}); };

async function abrirAsesor(primer){
  if(!chatId){ chatId="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,10); sessionStorage.setItem("ajChat",chatId); }
  if(live){ try{ await enviarAsesor(primer); }catch(e){} return; }
  opts([]); say("Buscando un asesor en línea…","b");
  let on=false;
  try{ const p = await api("presence","GET"); on = !!(p && Date.now()-p.ts < 60000); }catch(e){}
  if(!on) return porWhatsApp(primer);   /* nadie conectado → WhatsApp con asesor al azar */
  live = true;
  try{
    escuchar(); await enviarAsesor(primer); vigilar();
    say(`Listo, ${nombre}. Un asesor en línea ya recibió tu mensaje y te responde aquí mismo, en este chat.`,"b");
    opts([["Apartar / confirmar mi reserva",verQR],["Descargar mis fotos",guiaFotos],["Volver al asistente automático",salirAsesor]]);
  }catch(e){ live=false; porWhatsApp(primer); }
}
/* Si el asesor se desconecta, el cliente vuelve al bot */
function vigilar(){ clearInterval(presT);
  presT=setInterval(async()=>{ try{ const p=await api("presence","GET"); if(!(p && Date.now()-p.ts < 70000)) volverAlBot(); }catch(e){} },12000); }
function volverAlBot(){ if(!live) return; live=false; clearInterval(presT); if(es) es.close(); ctx={};
  say("El asesor se desconectó. Sigo yo, el asistente automático, para ayudarte con tu cotización, tu reserva o tus fotos. Si necesitas un asesor, te contacto por WhatsApp.","b");
  preguntaTipo(); }
function salirAsesor(){ live=false; clearInterval(presT); if(es) es.close(); say("Volviste al asistente automático. Puedes pedir un asesor cuando quieras.","b"); inicio(); }

function porWhatsApp(m){
  const a = asesorAzar(), url = wa(a.w,m);
  say(`Ahora mismo no hay asesores en línea, ${nombre}. Te voy a contactar con ${a.n} por WhatsApp, con tu mensaje ya escrito.\n\nSi no se abre solo, toca el botón.`,"b");
  window.open(url,"_blank","noopener");
  opts([["Abrir WhatsApp con "+a.n,()=>window.open(url,"_blank","noopener")],["Nueva recomendación",inicio]]);
}
function escuchar(){
  if(es) es.close();
  es = new EventSource(`${DB}/chats/${chatId}/msgs.json`);
  const f = ev => { const {path,data} = JSON.parse(ev.data);
    const items = path==="/" ? (data||{}) : {[path.slice(1)]:data};
    Object.entries(items).filter(([,m])=>m&&m.t).sort((a,b)=>a[1].ts-b[1].ts).forEach(([k,m])=>{
      if(vistos.has(k)) return; vistos.add(k);
      say(m.t, m.de==="c"?"u":"b", m.wa, m.qr);
      if(m.de!=="c" && Date.now()-m.ts<15000) beep(); }); };
  es.addEventListener("put",f); es.addEventListener("patch",f);
}

/* ===== Reserva: QR de $50.000 y datos completos; queda "pendiente" hasta que un asesor verifica el abono ===== */
/* El QR del abono lo envía SOLO el asesor en línea desde su panel; el bot nunca lo muestra por su cuenta */
function verQR(){
  if(!live){
    say(`El QR para apartar tu fecha (abono de ${peso(VALOR_APARTADO)}) te lo envía un asesor en línea. Ahora no hay ninguno conectado; si quieres, te contacto por WhatsApp para que te lo envíen.`,"b");
    return opts([["Hablar por WhatsApp con un asesor",contactar],["Volver al inicio",inicio]]); }
  say(`El abono para apartar tu fecha es de ${peso(VALOR_APARTADO)}. El asesor te envía el QR en este chat.\n\nCuando hagas el abono, toca «Ya hice el abono» y registro tu reserva para que él la confirme.`,"b");
  opts([["Pedir el QR al asesor",()=>enviarAsesor("Hola, ¿me envías el QR para apartar mi fecha?").catch(()=>say("No se pudo enviar. Revisa tu conexión.","b"))],
    ["Ya hice el abono",pedirFechaRes],["Volver al inicio",inicio]]);
}
function pedirFechaRes(){
  if(!nombre) return pedirNombre(pedirFechaRes);
  const L=ctx.lugar||{};   /* si ya dio los datos en la cotización, no se los vuelvo a pedir */
  ctx.res={iso:L.iso,fecha:L.fecha,h24:L.h24,tel:tel||"",tipo:ctx.tipo,loc:L.loc,barrio:L.barrio,dir:L.dir};
  siguienteRes(); }
function siguienteRes(){
  const R=ctx.res;
  if(!R.iso) return pide("rfecha","¿Para qué fecha es tu evento? Escríbela como dd/mm/aaaa.");
  if(!R.h24) return pide("rhora","¿A qué hora empieza? Solo en punto o y media, por ejemplo 7:00 pm o 7:30 pm.");
  if(!R.tel) return pide("rtel","¿A qué número de celular te contactamos?");
  if(!R.tipo){ ctx.esperando=null; say("¿Qué tipo de evento es?","b");
    return opts(TIPOS.map(t=>[t,()=>{ if(t==="Otro") pide("rtipoO","Escribe qué tipo de evento es."); else { R.tipo=t; siguienteRes(); } }])); }
  if(!R.loc){ ctx.esperando=null; say("¿En qué localidad es el evento?","b"); return opts(LOCALIDADES.map(l=>[l,()=>{ R.loc=l; siguienteRes(); }])); }
  if(!R.barrio) return pide("rbarrio","¿En qué barrio?");
  if(!R.dir) return pide("rdir","¿Cuál es la dirección del evento?");
  if(!R.ref) return pide("rref","Por último, escribe el nombre de quien hizo el abono o el número de referencia del comprobante.");
  ctx.esperando=null; guardarRes();
}
async function guardarRes(){
  const R=ctx.res, p=ctx.plan?PLANES.find(x=>x.id===ctx.plan):null, info=`${R.fecha} · ${fmtHora(R.h24)}`, cr=avisoCruce(R.iso,R.h24);
  const total = p&&ctx.h ? precioFinal(p,ctx.h,"Bogotá",R.loc) : 0;
  const msg=`Hola, soy ${nombre}. Hice el abono de ${peso(VALOR_APARTADO)} para confirmar mi reserva.\nEvento: ${R.tipo}\nFecha: ${R.fecha}\nHora: ${fmtHora(R.h24)}\nCelular: ${R.tel}\nLugar: ${R.dir}, ${R.barrio}, ${R.loc}\nReferencia del pago: ${R.ref}`+(cr?`\n${cr}`:"");
  try{
    await api("pendientes","POST",{nombre,tel:R.tel,tipo:R.tipo,fecha:R.iso,hora:R.h24,ciudad:"Bogotá",loc:R.loc,barrio:R.barrio,dir:R.dir,
      plan:p?p.nombre:"",horas:p?ctx.h:0,total,ref:R.ref,cruce:cr,chat:chatId||"",ts:Date.now()});
    say(`Listo, ${nombre}. Registré tu solicitud de reserva para el ${info}. Un asesor verifica tu abono de ${peso(VALOR_APARTADO)} y te confirma. Cuando la confirme, tu fecha queda apartada.`,"b");
    if(live){ enviarAsesor(`Hice el abono para confirmar mi reserva: ${info}. Referencia: ${R.ref}.`).catch(()=>{});
      opts([["Descargar mis fotos",guiaFotos],["Volver al asistente automático",salirAsesor]]); }
    else { const a=asesorAzar(); opts([["Avisar también por WhatsApp a "+a.n,()=>window.open(wa(a.w,msg),"_blank","noopener")],["Descargar mis fotos",guiaFotos],["Volver al inicio",inicio]]); }
  }catch(e){ say("No pude registrar la solicitud. Te contacto con un asesor por WhatsApp para confirmarla.","b"); porWhatsApp(msg); }
}

/* --- Preguntas libres --- */
function faq(t){
  t=t.toLowerCase();
  if(/espacio|ilumin|luz|[aá]rea|metros|corriente|enchufe|lugar/.test(t)) return espacio(ctx.plan);
  if(/incluye|trae|accesorio|props|operador/.test(t)) return PLANES.map(p=>`${p.nombre}: ${p.incluye.join(", ")}.`).join("\n\n")+"\n\nTodos los planes incluyen 2 operadores de logística.";
  if(/transporte|zona|ciudad|domicilio|lejos/.test(t)) return "El transporte y los 2 operadores están incluidos en Bogotá. Para otros municipios o ciudades, un asesor cotiza el transporte.";
  if(/reserv|fecha|disponib|apart/.test(t)) return "Arma tu cotización y envíala a un asesor para confirmar la disponibilidad. Para apartar la fecha se abonan $50.000 con un QR que te envía un asesor en línea.";
  return null;
}
$("say").onsubmit = e => { e.preventDefault(); clearTimeout(fotosT); const t=$("sayIn").value.trim(); if(!t) return; $("sayIn").value="";
  if(live && !ctx.esperando){ enviarAsesor(t).catch(()=>say("No se pudo enviar. Revisa tu conexión.","b")); return; }
  say(t,"u");
  if(ctx.esperando){ pasoTexto(t); return; }
  if(/recomiend|sugier|aconsej|cu[aá]l me conviene|no s[eé]/i.test(t)){
    if(ctx.inv && ctx.h){ setTimeout(recomendarAuto,250); return; }
    setTimeout(()=>{ say("Con gusto. Respóndeme unas preguntas rápidas y te recomiendo el plan ideal.","b"); inicio(); },250); return; }
  if(/\bqr\b|apartar|abono|se[ñn]a/i.test(t)){ setTimeout(verQR,250); return; }
  if(/precio|cuesta|valor|cu[aá]nto|tarifa/i.test(t)){ setTimeout(()=>{ say("El valor depende del plan, las horas y el lugar de tu evento. Respóndeme unas preguntas y al final te muestro tu cotización.","b"); opts([["Armar mi cotización",inicio]]); },250); return; }
  const r = faq(t);
  if(!r && /foto|video|descarg|c[oó]digo|galer/i.test(t)){ setTimeout(guiaFotos,250); return; }
  setTimeout(()=>{ if(r) say(r,"b"); else { say("Eso lo resuelve mejor un asesor. ¿Quieres que te contacte uno o que te recomiende según tu evento?","b"); opts([["Que me contacte un asesor",contactar],["Recomiéndame algo",inicio]]); } },250); };

/* ===== Indicador: la cabecera se pone verde cuando hay un asesor en línea ===== */
async function estado(){
  let on=false; try{ on = await asesorEnLinea(); }catch(e){}
  enLinea = on; $("hdr").classList.toggle("online",on);
  $("estado").textContent = on ? "● Asesor en línea" : "Asistente automático"; }
setInterval(estado,15000);

/* ===== Arranque y comunicación con index.html ===== */
$("botX").onclick = () => { if(EMB) parent.postMessage({t:"cerrar"},"*"); };
const saludo = () => { say("¡Hola! Soy el asistente de AJ Studio. Te ayudo a elegir el plan ideal para tu evento.","b"); inicio(); };

/* El cotizador de la página le entrega la cotización ya armada */
window.addEventListener("message", e => {
  if(e.source !== window.parent) return;
  const d = e.data || {};
  if(d.t==="cotizacion"){
    ctx={msg:d.msg}; say("Quiero reservar con un asesor","u");
    if(d.cruce) say(AVISO_CRUCE,"b");
    reservarCot(); }
});
if(EMB) parent.postMessage({t:"listo"},"*");
/* Primero se averigua si hay asesor en línea (máx. 1,5 s) para que el menú ya salga con el botón verde */
if(new URLSearchParams(location.search).get("modo")!=="cot") Promise.race([estado(),new Promise(r=>setTimeout(r,1500))]).then(saludo);
else estado();   /* con modo=cot espera la cotización del cotizador */
</script>
